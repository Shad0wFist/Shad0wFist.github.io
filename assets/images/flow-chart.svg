<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Кадровый цикл Screwdriver">
  <rect width="900" height="340" rx="14" fill="#0f172a"/>
  <text x="450" y="36" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">Кадровый цикл (game loop) Screwdriver</text>

  <g font-size="14" text-anchor="middle">
    <rect x="40" y="120" width="130" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="150" fill="#7dd3fc" font-weight="600">Input.poll()</text>
    <text x="105" y="170" fill="#94a3b8" font-size="11">опрос устройств</text>

    <rect x="210" y="120" width="130" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="275" y="150" fill="#7dd3fc" font-weight="600">Systems.update</text>
    <text x="275" y="170" fill="#94a3b8" font-size="11">ECS-системы, dt</text>

    <rect x="380" y="120" width="130" height="70" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="445" y="150" fill="#86efac" font-weight="600">Bolt.step()</text>
    <text x="445" y="170" fill="#94a3b8" font-size="11">фикс. шаг 120 Гц</text>

    <rect x="550" y="120" width="130" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="615" y="150" fill="#fcd34d" font-weight="600">Render.submit</text>
    <text x="615" y="170" fill="#94a3b8" font-size="11">команды GPU</text>

    <rect x="720" y="120" width="140" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="790" y="150" fill="#fcd34d" font-weight="600">Present + Stats</text>
    <text x="790" y="170" fill="#94a3b8" font-size="11">swapchain, FPS</text>
  </g>

  <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a2)">
    <path d="M170 155 H206"/>
    <path d="M340 155 H376"/>
    <path d="M510 155 H546"/>
    <path d="M680 155 H716"/>
    <path d="M790 190 V250 H105 V194"/>
  </g>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="450" y="272" fill="#94a3b8" font-size="12" text-anchor="middle">возврат к следующему кадру (target 60–144 FPS)</text>
  <text x="450" y="312" fill="#64748b" font-size="12" text-anchor="middle">Физика идёт фиксированными шагами независимо от частоты рендера — поэтому симуляция стабильна на любом железе</text>
</svg>
