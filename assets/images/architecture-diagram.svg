<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Архитектура движка Screwdriver">
  <rect width="900" height="560" rx="14" fill="#0f172a"/>
  <text x="450" y="40" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">Архитектура Screwdriver 2.4</text>
  <text x="450" y="62" fill="#94a3b8" font-size="13" text-anchor="middle">Модули ядра и их зависимости</text>

  <!-- Editor layer -->
  <rect x="60" y="84" width="780" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="80" y="112" fill="#f59e0b" font-size="16" font-weight="700">Workbench (редактор)</text>
  <text x="80" y="134" fill="#cbd5e1" font-size="12">Сцены, инспектор, таймлайн, профилировщик — всё это тонкий клиент поверх Core API</text>

  <!-- Scripting layer -->
  <rect x="60" y="170" width="380" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="80" y="198" fill="#38bdf8" font-size="16" font-weight="700">Torque (скриптинг)</text>
  <text x="80" y="220" fill="#cbd5e1" font-size="12">Lua 5.4 + JS-биндинги, горячая перезагрузка</text>

  <!-- Asset pipeline -->
  <rect x="460" y="170" width="380" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="480" y="198" fill="#38bdf8" font-size="16" font-weight="700">Crate (конвейер ассетов)</text>
  <text x="480" y="220" fill="#cbd5e1" font-size="12">Импорт, сжатие текстур, сборка бандлов .scw</text>

  <!-- Subsystems -->
  <rect x="60" y="262" width="180" height="80" rx="10" fill="#16233b" stroke="#475569"/>
  <text x="150" y="296" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Renderer</text>
  <text x="150" y="318" fill="#94a3b8" font-size="11" text-anchor="middle">Vulkan / OpenGL / WebGPU</text>

  <rect x="256" y="262" width="180" height="80" rx="10" fill="#16233b" stroke="#475569"/>
  <text x="346" y="296" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Bolt (физика)</text>
  <text x="346" y="318" fill="#94a3b8" font-size="11" text-anchor="middle">Rigid bodies, CCD, raycast</text>

  <rect x="452" y="262" width="180" height="80" rx="10" fill="#16233b" stroke="#475569"/>
  <text x="542" y="296" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Hum (аудио)</text>
  <text x="542" y="318" fill="#94a3b8" font-size="11" text-anchor="middle">3D-позиционирование, DSP</text>

  <rect x="648" y="262" width="192" height="80" rx="10" fill="#16233b" stroke="#475569"/>
  <text x="744" y="296" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Input / Net</text>
  <text x="744" y="318" fill="#94a3b8" font-size="11" text-anchor="middle">Геймпад, клавиатура, rollback</text>

  <!-- Core -->
  <rect x="60" y="366" width="780" height="86" rx="10" fill="#241a08" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="400" fill="#fbbf24" font-size="18" font-weight="700" text-anchor="middle">Core: ECS + Job Graph + Memory Arena</text>
  <text x="450" y="426" fill="#fde68a" font-size="12" text-anchor="middle">Entity-Component-System, планировщик задач, арена памяти без GC-пауз</text>

  <!-- Platform -->
  <rect x="60" y="470" width="780" height="56" rx="10" fill="#111827" stroke="#334155"/>
  <text x="450" y="504" fill="#94a3b8" font-size="14" text-anchor="middle">HAL: Windows / Linux / macOS / Web (WASM) / Android</text>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M450 154 V168"/>
    <path d="M250 240 V260"/>
    <path d="M650 240 V260"/>
    <path d="M150 342 V364"/>
    <path d="M346 342 V364"/>
    <path d="M542 342 V364"/>
    <path d="M744 342 V364"/>
    <path d="M450 452 V468"/>
  </g>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
